<!-- ═══════════════════════════════════════════════════════════════
     КиберОС — PWA патч
     Добавить в <head> после <meta viewport>
     ═══════════════════════════════════════════════════════════════ -->

<!-- 1. Ссылка на манифест -->
<link rel="manifest" href="manifest.json">

<!-- 2. Мета-теги для iOS (Safari не читает manifest) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КиберОС">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- 3. Цвет строки браузера на Android -->
<meta name="theme-color" content="#00e5ff">


<!-- ═══════════════════════════════════════════════════════════════
     Добавить в конец <body>, перед </body>
     (или встроить в существующий DOMContentLoaded)
     ═══════════════════════════════════════════════════════════════ -->
<script>
/* ── Service Worker ──────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => {
        console.log('[КиберОС SW] зарегистрирован, scope:', reg.scope);

        // Слушаем обновление SW — покажем уведомление пользователю
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // Новая версия готова — предложим перезагрузку
              UI.notify('КиберОС обновлён', 'Перезагрузите страницу для применения обновлений', 8000);
            }
          });
        });
      })
      .catch(err => console.warn('[КиберОС SW] ошибка:', err));
  });
}

/* ── PWA Install Banner ──────────────────────────────────────── */
let _pwaPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;

  // Показать кнопку установки в трее или Quick Menu
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  _pwaPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.style.display = 'none';
  if (typeof UI !== 'undefined') {
    UI.notify('КиберОС установлен!', 'Приложение добавлено на рабочий стол 🎉');
  }
});

// Вызвать установку (повесить на кнопку)
window.installPWA = async () => {
  if (!_pwaPrompt) return;
  _pwaPrompt.prompt();
  const { outcome } = await _pwaPrompt.userChoice;
  console.log('[PWA install]', outcome);
  _pwaPrompt = null;
};

/* ── Офлайн-статус ───────────────────────────────────────────── */
window.addEventListener('offline', () => {
  if (typeof UI !== 'undefined')
    UI.notify('Нет сети', 'КиберОС работает в офлайн-режиме', 4000);
});
window.addEventListener('online', () => {
  if (typeof UI !== 'undefined')
    UI.notify('Сеть восстановлена', 'Подключение к интернету активно');
});
</script>


<!-- ═══════════════════════════════════════════════════════════════
     Кнопка установки — добавить в трей (рядом с часами)
     Найди в HTML блок с id="clock" и вставь перед ним:
     ═══════════════════════════════════════════════════════════════ -->

<button
  id="pwa-install-btn"
  onclick="installPWA()"
  title="Установить КиберОС"
  style="display:none;align-items:center;gap:5px;padding:4px 10px;
         background:rgba(0,229,255,0.12);border:1px solid rgba(0,229,255,0.35);
         border-radius:7px;cursor:pointer;color:var(--a);
         font-size:calc(11px * var(--zoom));font-weight:700;transition:all .15s"
  onmouseover="this.style.background='rgba(0,229,255,0.22)'"
  onmouseout="this.style.background='rgba(0,229,255,0.12)'">
  ⬇ Установить
</button>
